plugins { id 'java-library'; id 'net.neoforged.moddev.legacyforge' version '2.0.148' }
version = '0.2.0-dev19-neoforge-1.20.1-wip'
group = 'com.feed'
base { archivesName = 'minefeed-neoforge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
legacyForge {
 enable { neoForgeVersion = '1.20.1-47.1.106'; disableRecompilation = true }
 runs { client { client() } }
 mods { feed { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
processResources { exclude 'assets/feed/font/OFL.txt' }
jar { manifest { attributes 'MixinConfigs': 'feed.neo.mixins.json' }; from('../LICENSE') { rename { 'LICENSE_MineFeed' } }; from('../src/main/resources/assets/feed/font/OFL.txt') { rename { 'FONT_LICENSE_OFL.txt' } } }
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
mixin { add sourceSets.main, 'feed.neo.refmap.json'; config 'feed.neo.mixins.json' }
