plugins { id 'fabric-loom' version '1.14.10' }
def modProperties = new Properties()
file('../gradle.properties').withInputStream { modProperties.load(it) }
version = modProperties.getProperty('mod_version')
group = 'com.feed'
base { archivesName = 'feed-fabric-1.21.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.6'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
def shared = tasks.register('prepareShared', Sync) {
    from('../src/main/java') {
        exclude 'com/feed/Feed.java', 'com/feed/client/NeoEvents.java', 'com/feed/client/FeedConfig.java',
                'com/feed/client/ModKeyMappings.java', 'com/feed/client/DevPreview.java'
    }
    into layout.buildDirectory.dir('generated/shared')
}
sourceSets.main.java.srcDir(shared)
sourceSets.main.resources.srcDir('../src/main/resources')
processResources {
    exclude 'META-INF/neoforge.mods.toml', 'pack.mcmeta'
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

jar { from('../LICENSE') { rename { 'LICENSE_MineFeed' } } }
